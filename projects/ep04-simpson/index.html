<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  Vibe知识大赏 · 标准模板 index.html (v2)
  ======================================
  架构: 纯时间函数渲染。window.render(t) 画出第 t 秒的画面。
  规矩:
    1. 画面只由 t 决定——随机数带固定种子，禁止 setTimeout/rAF 驱动内容
    2. 五区布局: 左上水印 / 顶标签带 / 中央动画区(30-65%) / y70% 注释带 / y85-91% 双语字幕带
    3. 深蓝黑底 #0A0A1E，白字 #EAEAF2；Juno 纸艺风: 金 #C9A96A + 米白纸 #EDE4D3 + 红印章 #B53A2F
    4. 每句旁白 = 中文主句 + 英文斜体小字（双语标配）
    5. 15-20 秒处落《片名》标题卡；缓动 easeInOut/弹簧，禁止匀速
    6. 每句字幕停留 ≥ 2.5s；同一画面 ≤ 4s 必须有新元素（画面密度实测均值 3.97）
  使用: 替换 CFG / SUBTITLES / SECTIONS / TITLE_CARD，在 drawScene 里实现中央动画。
-->
<title>为什么每组都赢了，合起来却输了？ · 第四期</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A0A1E; }
  #stage { position: relative; width: 1920px; height: 1080px; background: #0A0A1E; }
  .layer { position: absolute; inset: 0; }
  #bg { z-index: 1; } #scene { z-index: 10; } #overlay { z-index: 20; }

  #watermark { position: absolute; top: 40px; left: 56px; z-index: 30;
    font: 500 26px 'Noto Sans SC'; color: rgba(234,234,242,.45); letter-spacing: 2px; }
  #toplabel { position: absolute; top: 44px; left: 0; right: 0; z-index: 30;
    text-align: center; font: 500 30px 'Noto Sans SC'; color: #8A8AA0; letter-spacing: 6px; }
  #annotation { position: absolute; top: 756px; left: 0; right: 0; z-index: 30;
    text-align: center; font: 400 27px 'Noto Sans SC'; color: #8A8AA0; }

  /* 双语旁白字幕: 中文主句 + 英文斜体 */
  #subtitle { position: absolute; top: 906px; left: 0; right: 0; z-index: 40; text-align: center;
    font: 700 46px 'Noto Sans SC'; color: #EAEAF2; letter-spacing: 1px;
    text-shadow: 0 2px 24px rgba(0,0,0,.8); }
  #subtitle em { font-style: normal; color: #C9A96A; }
  #subtitle-en { position: absolute; top: 972px; left: 0; right: 0; z-index: 40; text-align: center;
    font: italic 400 26px 'EB Garamond', serif; color: #8A8AA0; letter-spacing: .5px; }

  /* 标题卡（15-20s 处，全屏元素） */
  #titlecard { position: absolute; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 26px; }
  #titlecard .series { font: 500 24px 'Noto Sans SC'; color: rgba(201,169,106,.75); letter-spacing: 14px; text-indent: 14px; }
  #titlecard .name   { font: 900 118px 'Noto Serif SC', serif; color: #C9A96A; letter-spacing: 6px;
    text-shadow: 0 4px 40px rgba(201,169,106,.25); }
  #titlecard .q      { font: 500 34px 'Noto Sans SC'; color: #EAEAF2; margin-top: 14px; }
  #titlecard .q-en   { font: italic 400 26px 'EB Garamond', serif; color: #8A8AA0; }

  @font-face {font-family: FilmSans; src:url('fonts/sans.ttc'); font-weight:400;}
  @font-face {font-family: FilmSans; src:url('fonts/sans-bold.ttc'); font-weight:700 900;}
  @font-face {font-family: FilmSerif; src:url('fonts/serif.ttc');}
  @font-face {font-family: FilmItalic; src:url('fonts/latin-italic.ttf');}
  #toplabel {top:50px;font:400 32px FilmSans;letter-spacing:5px;color:#a79d88;}
  #annotation {top:856px;font:400 30px FilmSans;color:#9a978f;letter-spacing:1px;}
  #subtitle {top:912px;font:700 64px FilmSans;color:#ede4d3;letter-spacing:1px;}
  #subtitle-en {top:998px;font:italic 32px FilmItalic;color:#a29d95;letter-spacing:.1px;}
  #titlecard {pointer-events:none;}
  #titlecard .series {font:400 22px FilmSans;letter-spacing:8px;}
  #titlecard .name {font:400 63px FilmSerif;letter-spacing:3px;}
  #titlecard .q {font:400 26px FilmSans;color:#d8cdb6;}
  #titlecard .q-en {font:italic 24px FilmItalic;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer" width="1920" height="1080"></canvas>
  <canvas id="scene" class="layer" width="1920" height="1080"></canvas>
  <div id="overlay" class="layer"></div>

  <div id="toplabel"></div>
  <div id="annotation"></div>
  <div id="subtitle"></div>
  <div id="subtitle-en"></div>
  <div id="titlecard" style="display:none">
    <div class="series">第四期 · 同一批投篮记录</div>
    <div class="name">《片名》</div>
    <div class="q">一句话副标题？</div>
    <div class="q-en">One-line Question</div>
  </div>
</div>

<script src="records.js"></script><script src="timeline.js"></script><script src="scenes.js"></script>
</body></html>
